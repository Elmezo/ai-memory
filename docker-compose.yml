services:

  # Elasticsearch only. This is the LOCAL DEVELOPMENT stack: security is off and
  # the port is loopback-bound. For production, enable xpack.security with real
  # credentials and TLS, and set the matching ES_USERNAME / ES_PASSWORD /
  # ES_CA_CERTS / ES_VERIFY_CERTS on the memory-api service (see SECURITY.md).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: ai-memory-elasticsearch

    environment:
      # Local development only: security is disabled for a frictionless
      # single-node setup. Enable xpack.security and TLS for any shared or
      # networked deployment (see SECURITY.md).
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"

    ports:
      # Bind to loopback only so the (unauthenticated) dev index is not
      # reachable from other hosts. Remove the 127.0.0.1 prefix only behind a
      # firewall/authenticating proxy.
      - "127.0.0.1:9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

volumes:
  elasticsearch_data: