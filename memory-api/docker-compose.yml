services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: ai-memory-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  memory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-memory-api
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_INDEX=agent_memory
      - ES_TIMEOUT=15
      - ES_MAX_RETRIES=10
      - ES_RETRY_BACKOFF=2.0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - AUTH_MODE=disabled
      - EMBEDDING_PROVIDER=hash
      - EMBEDDING_DIMS=384
    ports:
      - "8000:8000"
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  elasticsearch_data:
    name: ai-memory_elasticsearch_data
    external: true
